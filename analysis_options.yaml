include:
  - package:very_good_analysis/analysis_options.yaml
analyzer:
  exclude:
    - lib/gen/*
    - lib/l10n/gen/*
    # flutter_rust_bridge owns and regenerates this glue.
    - lib/src/rust/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
linter:
  rules:
    public_member_api_docs: false
