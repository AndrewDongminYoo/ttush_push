version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: daily
    ignore:
      # FRB must move with the Rust crate, codegen, and generated glue.
      - dependency-name: flutter_rust_bridge
