name: ttush_push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  semantic-pull-request:
    # The repo's default GITHUB_TOKEN grants contents+packages read only, so
    # the action's GET /pulls/{n} came back "Resource not accessible by
    # integration". The reusable workflow declares no permissions of its own.
    permissions:
      pull-requests: read
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@0d81600dd37bc87a473ee5b6e2293bef05751b04 # v1.20.1

  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@0d81600dd37bc87a473ee5b6e2293bef05751b04 # v1.20.1
    with:
      run_bloc_lint: false
      coverage_excludes: lib/src/rust/** lib/game/rules/rules_engine.dart
      setup: |
        sudo apt-get update
        sudo apt-get install --yes imagemagick

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Rust formatter and linter
        run: rustup component add rustfmt clippy

      - name: Verify formatting
        run: cargo fmt --manifest-path engine/Cargo.toml -- --check

      - name: Lint
        run: cargo clippy --manifest-path engine/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path engine/Cargo.toml

  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build the Rust host library
        run: cargo build --release --manifest-path engine/Cargo.toml --lib

      - name: Test the generated bridge
        run: flutter test tool/rules_engine_host_test.dart

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install the Rust Web toolchain
        run: rustup toolchain install nightly --profile minimal --component rust-src --target wasm32-unknown-unknown

      - name: Install Web build tools
        run: |
          cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
          cargo install wasm-pack --version 0.15.0 --locked

      - name: Build the production Web app
        run: tool/build_web.sh

  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@0d81600dd37bc87a473ee5b6e2293bef05751b04 # v1.20.1
    with:
      includes: |
        **/*.md
      modified_files_only: false
      config: cspell.json
