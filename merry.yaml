# Script definitions for `merry run <name>`. Run `merry ls` to list them.

# --- Development ------------------------------------------------------------
dev:
  (description): Runs the development flavor on the connected device.
  (scripts): flutter run --flavor development --target lib/main_development.dart

# --- Builds -----------------------------------------------------------------
build:
  (default): $build:web

  web:
    (description): Builds the production Web app with its Rust Wasm payload.
    (scripts): tool/build_web.sh

  apk:
    (description): Builds the production Android APK using the pubspec version.
    (scripts): flutter build apk --release --flavor production --target lib/main_production.dart

  aab:
    (description): Builds the production Android App Bundle using the pubspec version.
    (scripts): flutter build appbundle --release --flavor production --target lib/main_production.dart

  ipa:
    (description): Builds the production iOS archive and IPA using the pubspec version, and fails if export produces no fresh IPA.
    (scripts):
      - flutter build ipa --release --flavor production --target lib/main_production.dart
      - |
        fresh_ipa_count=$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -newer build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Runner -print 2>/dev/null | wc -l | tr -d ' ')
        if [ "$fresh_ipa_count" -ne 1 ]; then
          echo "Expected exactly one fresh IPA in build/ios/ipa, found $fresh_ipa_count." >&2
          exit 1
        fi

# --- Dart gates -------------------------------------------------------------
format:
  (description): Formats the hand-written Dart sources.
  (default): dart format lib test integration_test test_driver

  check:
    (description): Fails when the hand-written Dart sources are not formatted.
    (scripts): dart format --output=none --set-exit-if-changed lib test integration_test test_driver

analyze:
  (description): Runs very_good_analysis over the Dart sources.
  (scripts): flutter analyze

test:
  (description): Runs the Flutter unit and widget tests.
  (scripts): flutter test

coverage:
  (aliases): cov
  (description): Runs the Flutter tests under the same coverage gate as CI.
  (scripts): very_good test -j 4 --optimization --coverage --min-coverage 100 --exclude-coverage 'lib/src/rust/** lib/game/rules/rules_engine.dart' --report-on lib

# --- Rust engine gates ------------------------------------------------------
rust:
  (description): Gates for the rules engine crate.
  (default): $rust:test

  format:
    (description): Formats the whole engine crate.
    (default): cargo fmt --manifest-path engine/Cargo.toml

    check:
      (description): Fails when the engine crate is not formatted.
      (scripts): cargo fmt --manifest-path engine/Cargo.toml -- --check

  lint:
    (description): Runs clippy over every engine target with warnings denied.
    (scripts): cargo clippy --manifest-path engine/Cargo.toml --all-targets -- -D warnings

  test:
    (description): Runs the engine rules, bridge, and simulation tests.
    (scripts): cargo test --manifest-path engine/Cargo.toml

  simulate:
    (description): Replays a fixed seed so balance changes can be diffed run to run.
    (scripts): cargo run --release --manifest-path engine/Cargo.toml -- --games 100000 --seed 42

# --- Bridge gate ------------------------------------------------------------
bridge:
  (description): Gates the generated Dart/Rust bridge on a host runtime.
  (default): $bridge:host

  host:
    (description): Builds and loads the Rust library through the generated Dart bridge.
    (scripts):
      - cargo build --release --manifest-path engine/Cargo.toml --lib
      - flutter test tool/rules_engine_host_test.dart

parity:
  (description): Runs the native parity test on every simulator or emulator already running, and skips when none is.
  (scripts): bash tool/run_parity.sh

# --- Code generation --------------------------------------------------------
generate:
  (description): Regenerates code that is owned by a generator, never by hand.
  (default): $generate:bridge

  bridge:
    (description): Regenerates the flutter_rust_bridge glue after an engine/src/api.rs change.
    (scripts): tool/generate_rust_bridge.sh

  l10n:
    (description): Regenerates localizations from the ARB files.
    (scripts): flutter gen-l10n

  sfx:
    (description): Re-synthesizes the round's sound effects into assets/sfx.
    (scripts): dart run tool/generate_sfx.dart

# --- Aggregate gate ---------------------------------------------------------
check:
  (description): The full local gate before committing.
  (execution): once
  (scripts):
    - $format:check
    - $analyze
    - $coverage
    - $rust:format:check
    - $rust:lint
    - $rust:test
    - $bridge:host
    - trunk check --no-progress
    - $parity
